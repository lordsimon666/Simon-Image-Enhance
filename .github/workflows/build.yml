name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # PoCL = OpenCL on the CPU, lavapipe = Vulkan on the CPU: the GPU kernels and the
      # Vulkan inference are tested even without a GPU
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libxkbcommon0
      - run: pip install -r requirements.txt pytest pocl-binary-distribution
      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/SimonImageEnhance/models
          key: ai-models-${{ hashFiles('simon_enhance/ai/models.py') }}
      - name: Tests (incl. the downloadable AI models)
        env:
          SIE_AI_DOWNLOAD: "1"
        run: python -m pytest -q -rs
      - name: GPU kernels were really tested
        run: |
          # Vulkan (lavapipe) must work - it runs the Vulkan filter and ncnn inference tests
          SIE_ALLOW_CPU_VULKAN=1 python -c "from simon_enhance import vulkan_compute as v; print('Vulkan:', v.name(), v.error()); assert v.available()"
          # PoCL (OpenCL on the CPU) cannot compile kernels on some runner CPUs it does not
          # know yet ("unknown target CPU"); that is a limitation of the test tool, not of
          # the app, so it only produces a warning
          SIE_OPENCL_ALLOW_CPU=1 python -c "from simon_enhance import gpu; import sys; print(gpu.status()); sys.exit(0 if gpu.available() else 1)" \
            || echo "::warning::OpenCL-Tests übersprungen: PoCL kennt die CPU dieses Runners nicht"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer + portable
        shell: pwsh
        run: .\packaging\windows\build.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          python -c "import onnxruntime as o; print(o.get_available_providers())"
          $p = Start-Process dist\SimonImageEnhance\SimonImageEnhance.exe -PassThru
          Start-Sleep 10
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process $p
      - name: DirectML diagnostics (bundle contents, plain Python vs. frozen app)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist\SimonImageEnhance -Include DirectML*.dll,onnxruntime*.dll,onnxruntime_providers*.dll | ForEach-Object { "$($_.FullName) $($_.Length)" }
          python -c "import onnxruntime as o, os; print(o.__version__, o.get_available_providers()); print(os.listdir(os.path.join(os.path.dirname(o.__file__), 'capi')))"
          python -c "import onnxruntime as o; o.set_default_logger_severity(0); s = o.InferenceSession('simon_enhance/assets/models/realesr-general-x4v3.onnx', providers=['DmlExecutionProvider']); print('DML session providers:', s.get_providers())" 2>&1 | Select-Object -Last 25
      - name: AI check on Windows (DirectML incl. denoise, each device in its own process)
        shell: pwsh
        run: |
          $env:SIE_DIAG_FILE = "$PWD\diagnose.txt"
          $p = Start-Process dist\SimonImageEnhance\SimonImageEnhance.exe -ArgumentList "--ai-info","--download" -PassThru -Wait
          Get-Content diagnose.txt
          if ($p.ExitCode -ne 0) { throw "--ai-info failed with code $($p.ExitCode)" }
          if (-not (Select-String -Path diagnose.txt -Pattern "scunet")) { throw "denoise model was not checked" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-Setup.exe
            dist/*-Windows-Portable.zip

  linux:
    runs-on: ubuntu-22.04   # oldest supported glibc -> runs on most distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System libraries (bundled into the app)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 xvfb rpm
      - name: Build bundle
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/simon_enhance.spec --noconfirm --clean
          echo "VERSION=$(python -c 'import simon_enhance; print(simon_enhance.__version__)')" >> $GITHUB_ENV
      - name: Smoke test
        run: |
          timeout 10 xvfb-run -a dist/SimonImageEnhance/SimonImageEnhance || [ $? -eq 124 ]
          dist/SimonImageEnhance/SimonImageEnhance --gpu-info || true  # no GPU on CI runners
          dist/SimonImageEnhance/SimonImageEnhance --ai-info
      - name: Tarball
        run: tar -C dist/SimonImageEnhance -czf dist/SimonImageEnhance-linux.tar.gz .
      - name: .deb
        run: packaging/linux/build_deb.sh dist/SimonImageEnhance "$VERSION" dist
      - name: AppImage
        run: |
          sudo apt-get install -y libfuse2 || true
          packaging/linux/build_appimage.sh dist/SimonImageEnhance "$VERSION" dist
      - name: .rpm
        run: packaging/linux/build_rpm.sh dist/SimonImageEnhance "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/SimonImageEnhance-linux.tar.gz

  linux-ai:
    # the frozen app runs the AI models in GPU worker processes - checked in parallel to the
    # package tests so it does not hold up the build
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/SimonImageEnhance/models
          key: ai-models-frozen-scunet-v1
      - name: GPU worker processes + end-to-end denoise (software Vulkan counts as GPU here)
        run: |
          mkdir app && tar -C app -xzf SimonImageEnhance-linux.tar.gz
          SIE_ALLOW_CPU_VULKAN=1 app/SimonImageEnhance --ai-info --download --models scunet,realesr | tee ai.txt
          grep -q "Entrauschen (Ende-zu-Ende): OK" ai.txt

  fedora:
    # install the .rpm on a real Fedora: verifies that dnf can resolve all dependencies
    needs: linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install with dnf (incl. recommended OpenCL driver)
        run: dnf install -y ./pkg/simon-image-enhance.x86_64.rpm xorg-x11-server-Xvfb
      - name: Check installation
        run: |
          rpm -q simon-image-enhance
          simon-image-enhance --version
          rpm -q mesa-libOpenCL && echo "OpenCL driver installed"
          simon-image-enhance --gpu-info || true   # CI runners have no GPU
          simon-image-enhance --ai-info
          # the bundle is built on Ubuntu: downloads must still find Fedora's certificates
          simon-image-enhance --net-check
      - name: Smoke test (GUI starts)
        run: |
          Xvfb :99 & sleep 2
          DISPLAY=:99 timeout 15 simon-image-enhance || [ $? -eq 124 ]
      - name: Uninstall
        run: dnf remove -y simon-image-enhance

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SimonImageEnhance.flatpak
          manifest-path: packaging/flatpak/io.github.lordsimon666.SimonImageEnhance.yml
          cache: false
          upload-artifact: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux, linux-ai, fedora, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/linux/*
            artifacts/**/*.flatpak

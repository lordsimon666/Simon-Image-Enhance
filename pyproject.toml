[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simon-image-enhance"
dynamic = ["version"]
description = "Lightroom-style photo editor with white balance, tone curves and AI auto correction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
    "Pillow>=10.0",
    "rawpy>=0.19",
    "imageio>=2.31",
    "pyopencl>=2024.1",
    "tifffile>=2023.1",
    "wgpu>=0.19",
    "ncnn>=1.0.20240410",
    "onnxruntime-openvino>=1.20; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.18; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.0"]

[project.gui-scripts]
simon-image-enhance = "simon_enhance.app:main"

[tool.setuptools]
packages = ["simon_enhance", "simon_enhance.ai"]

[tool.setuptools.dynamic]
version = { attr = "simon_enhance.__version__" }

[tool.setuptools.package-data]
simon_enhance = ["assets/*", "assets/models/*"]
